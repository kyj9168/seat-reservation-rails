services:
  web:
    build: .
    ports:
      - "3000:80"
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_MAX_THREADS: "10"
      SOLID_QUEUE_IN_PUMA: "true"
      DEMO_MODE: "true"
      APP_HOST: "localhost"
      APP_PORT: "3000"
    volumes:
      - board_storage:/rails/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  board_storage:
